<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fichário de Concurso</title>
<meta name="description" content="Flashcards para concurso: certo ou errado, múltipla escolha, lacunas e revisão espaçada.">
<meta name="theme-color" content="#1d5c88">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: uma coluna estreita de app (max 760px); a revisão vira uma ficha pautada no centro da tela */
:root{
  --bg:#eef2f1; --surface:#ffffff; --sunk:#e4eae8; --ink:#16212a; --muted:#56636d; --line:#d3dbd8;
  --accent:#1d5c88; --accent-ink:#ffffff; --accent-soft:#dbe8f2;
  --mark:#ffe36b; --mark-ink:#2a2300; --rule:#d9534f; --pauta:#e3ecf3;
  --good:#23794a; --good-soft:#dcefe3; --bad:#b8352a; --bad-soft:#f6e0dd; --warn:#9a6512; --warn-soft:#f5ead5;
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151a; --surface:#172028; --sunk:#121a20; --ink:#e4ebef; --muted:#93a2ad; --line:#2a3741;
  --accent:#6eb2e0; --accent-ink:#0b1720; --accent-soft:#1d3446;
  --mark:#e2c23a; --mark-ink:#1d1800; --rule:#e0716b; --pauta:#1e2a33;
  --good:#5cc28b; --good-soft:#18352a; --bad:#ef7466; --bad-soft:#3d1f1c; --warn:#e2aa50; --warn-soft:#3a2d17;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151a; --surface:#172028; --sunk:#121a20; --ink:#e4ebef; --muted:#93a2ad; --line:#2a3741;
  --accent:#6eb2e0; --accent-ink:#0b1720; --accent-soft:#1d3446;
  --mark:#e2c23a; --mark-ink:#1d1800; --rule:#e0716b; --pauta:#1e2a33;
  --good:#5cc28b; --good-soft:#18352a; --bad:#ef7466; --bad-soft:#3d1f1c; --warn:#e2aa50; --warn-soft:#3a2d17;
  color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.6rem;letter-spacing:-.01em}
h2{font-size:1.25rem}
h3{font-size:1.02rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:40px;font-weight:700;font-size:.95rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.88rem;margin-bottom:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
/* resumo do dia */
.today{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.today>div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.today .big{font-family:var(--display);font-size:2rem;line-height:1}
.today .first{gap:10px}
@media (max-width:560px){.today{grid-template-columns:1fr 1fr}.today .first{grid-column:1/-1}}
/* baralhos */
.decks{display:flex;flex-direction:column}
.deck{display:grid;grid-template-columns:6px 1fr auto;gap:14px;align-items:center;padding:14px 16px 14px 0;border-top:1px solid var(--line)}
.deck:first-child{border-top:0}
.deck .sw{align-self:stretch;border-radius:0 4px 4px 0}
.deck .name{font-weight:700;font-size:1.05rem;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.deck .name:hover{color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.due{background:var(--accent-soft);color:var(--accent)}
.chip.new{background:var(--good-soft);color:var(--good)}
.chip.ex{background:var(--mark);color:var(--mark-ink)}
.empty{padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px;flex-wrap:wrap}
/* lista de cartas */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.cards{display:flex;flex-direction:column}
.citem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.citem:first-child{border-top:0}
.citem:hover{background:var(--sunk)}
.citem .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tchip{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);min-width:44px;text-align:center}
/* editor */
.field{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 6px;font-weight:700;font-size:.86rem;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:520px){.seg{grid-template-columns:1fr 1fr}.seg button:nth-child(3){border-left:0}.seg button:nth-child(n+3){border-top:1px solid var(--line)}}
.rich{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.tb{display:flex;flex-wrap:wrap;gap:2px;padding:4px;border-bottom:1px solid var(--line);background:var(--sunk)}
.tb button{border:0;background:none;min-width:34px;height:32px;border-radius:6px;font-weight:700;color:var(--ink)}
.tb button:hover{background:var(--surface)}
.tb .sep{width:1px;background:var(--line);margin:4px 3px}
.ed{min-height:84px;padding:10px 12px;outline:none;overflow-wrap:anywhere}
.ed:empty::before{content:attr(data-ph);color:var(--muted)}
.ed img,.content img{max-width:100%;height:auto;border-radius:6px;display:block;margin:6px 0}
.ed ul,.ed ol,.content ul,.content ol{padding-left:1.3em;margin:4px 0}
input.txt,select.txt,textarea.txt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;width:100%}
textarea.txt{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
.opt{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center}
.opt .letter{font-family:var(--display);font-weight:700;width:22px;text-align:center}
.ce-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radio-card{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);cursor:pointer;font-weight:700}
.radio-card:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.hint{font-size:.84rem;color:var(--muted)}
.err{color:var(--bad);font-size:.88rem;font-weight:700}
mark,.content mark{background:var(--mark);color:var(--mark-ink);padding:0 2px;border-radius:2px}
/* revisão: ficha pautada */
.study-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.ficha{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(10,30,50,.35);padding:66px 22px 22px;
  background-image:linear-gradient(var(--rule),var(--rule)),repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--pauta) 31px,var(--pauta) 32px);
  background-size:100% 2px,100% 100%;background-position:0 52px,0 60px;background-repeat:no-repeat,repeat;line-height:32px;font-size:1.1rem;min-height:220px}
.ficha .meta{position:absolute;top:0;left:22px;right:22px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;line-height:1.25}
.ficha .meta .deck{flex:1 1 auto;font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ficha .meta .type{display:flex;gap:6px;align-items:center;font-size:.82rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.cz{font:inherit;color:var(--ink);border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:4px 4px 0 0;padding:0 6px;line-height:1.4;max-width:100%}
mark.ok{background:var(--good-soft);color:var(--good)}
s.typed{color:var(--bad)}
.ficha .tshort{display:none}
@media (max-width:520px){.ficha .tlong{display:none}.ficha .tshort{display:inline}}
.yours{margin-top:14px;padding:6px 12px;border-left:3px solid var(--line);line-height:1.5}
.typed-in{margin-top:14px;font-family:var(--body)!important;font-size:1rem!important;min-height:0!important;line-height:1.5}
.ficha .content p{margin:0}
.verso{margin-top:16px;padding-top:14px;border-top:2px dashed var(--line)}
.blank{display:inline-block;min-width:4em;border-bottom:2px solid var(--accent);color:transparent;line-height:1.2}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.choice{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;line-height:1.45;font-size:1rem}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .l{font-family:var(--display);font-weight:700;color:var(--muted)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.ce-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.ce-row .choice{grid-template-columns:1fr;text-align:center;font-weight:700;font-size:1.05rem}
.result{margin-top:14px;padding:10px 14px;border-radius:8px;font-weight:700;line-height:1.45}
.result.ok{background:var(--good-soft);color:var(--good)}
.result.no{background:var(--bad-soft);color:var(--bad)}
.comment{margin-top:12px;line-height:1.5;font-size:1rem}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.grades.three{grid-template-columns:repeat(3,1fr)}
.grade{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 4px;font-weight:700}
.grade small{font-weight:400;color:var(--muted);font-size:.78rem}
.grade.g1{border-color:var(--bad);color:var(--bad)}
.grade.g2{border-color:var(--warn);color:var(--warn)}
.grade.g3{border-color:var(--good);color:var(--good)}
.grade.g4{border-color:var(--accent);color:var(--accent)}
.grade:hover{background:var(--sunk)}
.keys{margin-top:14px;font-size:.78rem;color:var(--muted);text-align:center}
@media (hover:none){.keys{display:none}}
kbd{font:inherit;font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:700;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
pre.fmt{background:var(--sunk);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:.8rem;margin:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px;font-weight:700;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.auth{max-width:420px;margin:6vh auto 0}
.auth form{display:flex;flex-direction:column;gap:12px}
.auth .tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.auth .tabs button{border:0;background:var(--surface);padding:9px;font-weight:700;color:var(--muted)}
.auth .tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.who{font-size:.88rem;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;background:var(--sunk);padding:4px 8px;border-radius:6px;user-select:all;overflow-wrap:anywhere}
.chip.shared{background:var(--warn-soft);color:var(--warn)}
.deck .tw{display:flex;align-items:center;gap:6px;min-width:0}
.fold{border:0;background:none;width:28px;height:28px;border-radius:6px;color:var(--muted);font-size:.8rem;flex:none}
.fold:hover{background:var(--sunk);color:var(--ink)}
.fold.none{visibility:hidden}
.subs{display:flex;flex-direction:column}
.crumbs{font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:inherit}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="top"><div class="brand"><h1>Fichário de Concurso</h1></div></div>
  <div class="panel empty"><p class="muted">Abrindo seu fichário…</p></div>
</div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { extractPdfText, parseQuestions, parseAnswerKey, pdfPageCount, ocrPdf, cancelOcr, SUBJECT_NAMES, lastOcr, lastText } from "./pdf-import.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, connectAuthEmulator, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, connectFirestoreEmulator, persistentLocalCache, persistentMultipleTabManager, doc, collection, setDoc, deleteDoc, updateDoc, getDoc, onSnapshot, query, where, arrayUnion, arrayRemove, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
(() => {
"use strict";
const $app = document.getElementById("app");
const DAY = 864e5, MIN = 6e4;
const COLORS = ["#3b7dd8","#2e9e6a","#d9822b","#c2477a","#7a5cc7","#3a9aa8","#b0892a"];
const TYPES = {basic:"Frente e verso", ce:"Certo ou errado", mc:"Múltipla escolha", cloze:"Lacuna"};
const TSHORT = {basic:"F/V", ce:"C/E", mc:"A–E", cloze:"Lacuna"};
const LETTERS = "ABCDE";

const S = {decks:{}, cards:{}, profile:{log:{}, newPerSession:20}, mode:"loading"};
let view = {name:"home"};
let me = null; // usuário logado
const PROG = ["reps","ivl","ease","due","lapses","last"];
const mkId = deck => deck && deck.startsWith("s:") ? deck + ":" + uid() : uid();

/* ---------- utilidades ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const today = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const endOfToday = () => { const d = new Date(); d.setHours(23,59,59,999); return d.getTime(); };
const plain = html => { const d = document.createElement("div"); d.innerHTML = html || ""; return (d.textContent || "").replace(/\s+/g, " ").trim(); };
let toastT;
function toast(msg){ let t = document.querySelector(".toast"); if(!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* HTML seguro: só formatação básica e imagens embutidas */
const OK_TAGS = new Set(["B","STRONG","I","EM","U","S","MARK","SPAN","FONT","BR","P","DIV","UL","OL","LI","IMG","SUB","SUP","BLOCKQUOTE"]);
const DROP_TAGS = new Set(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","LINK","META","SVG","MATH","FORM","INPUT","BUTTON","TEXTAREA","SELECT"]);
function clean(html){
  const doc = new DOMParser().parseFromString("<div>" + (html || "") + "</div>", "text/html");
  const root = doc.body.firstChild;
  (function walk(node){
    [...node.childNodes].forEach(ch => {
      if (ch.nodeType === 8) { ch.remove(); return; }
      if (ch.nodeType !== 1) return;
      if (DROP_TAGS.has(ch.tagName)) { ch.remove(); return; }
      walk(ch);
      if (!OK_TAGS.has(ch.tagName)) { ch.replaceWith(...ch.childNodes); return; }
      const keep = {};
      if (ch.tagName === "IMG") { const src = ch.getAttribute("src") || ""; if (/^data:image\/(png|jpe?g|gif|webp);/i.test(src)) keep.src = src; else { ch.remove(); return; } }
      if (ch.tagName === "FONT") { const c = ch.getAttribute("color"); if (c && /^#?[\w]+$/.test(c)) keep.color = c; }
      const st = [];
      if (ch.style && ch.style.color) st.push("color:" + ch.style.color);
      if (ch.style && ch.style.backgroundColor) st.push("background-color:" + ch.style.backgroundColor);
      [...ch.attributes].forEach(a => ch.removeAttribute(a.name));
      Object.entries(keep).forEach(([k,v]) => ch.setAttribute(k, v));
      if (st.length && /^[\w\s#(),.%:;-]+$/.test(st.join(";"))) ch.setAttribute("style", st.join(";"));
    });
  })(root);
  return root.innerHTML.trim();
}
const isBlank = html => !plain(html) && !/<img/i.test(html || "");

/* ---------- agenda de revisão (estilo Anki/SM-2) ---------- */
function schedule(c, g){
  const n = {...c};
  let ivl = c.ivl || 0, ease = c.ease || 2.5;
  if (g === 1) { n.lapses = (c.lapses||0) + (c.reps ? 1 : 0); ease = Math.max(1.3, ease - .2); ivl = 0; n.due = Date.now() + 10*MIN; }
  else {
    if (g === 2) { ivl = ivl < 1 ? 1 : Math.max(ivl + 1, Math.round(ivl * 1.2)); ease = Math.max(1.3, ease - .15); }
    if (g === 3) { ivl = ivl < 1 ? 1 : ivl < 3 ? 3 : Math.max(ivl + 1, Math.round(ivl * ease)); }
    if (g === 4) { ivl = ivl < 1 ? 4 : Math.max(ivl + 2, Math.round(ivl * ease * 1.3)); ease += .15; }
    // vence às 4h do dia agendado, para aparecer logo de manhã
    n.due = new Date(new Date(Date.now() + ivl*DAY).setHours(4,0,0,0)).getTime();
  }
  n.ivl = ivl; n.ease = Math.round(ease*100)/100; n.reps = (c.reps||0) + 1; n.last = Date.now();
  return n;
}
function ivlText(c, g){
  const n = schedule(c, g);
  if (g === 1) return "10 min";
  const d = n.ivl; if (d < 30) return d + " d"; if (d < 365) return Math.round(d/30) + " m"; return (d/365).toFixed(1).replace(".", ",") + " a";
}
const isNew = c => !c.reps;
const isDue = c => !isNew(c) && (c.due || 0) <= Date.now();
function dueLabel(c){
  if (isNew(c)) return "nova";
  const diff = (c.due||0) - Date.now();
  if (diff <= 0) return "revisar";
  if (diff < DAY && today(c.due) === today()) return "hoje";
  const d = Math.ceil(diff / DAY); return "em " + d + " d";
}

/* ---------- armazenamento: banco do artefato (sincroniza) ou navegador ---------- */
const store = (() => {
  let app, auth, db; const chains = {}; let unsubs = [];
  const shared = {}, sharedCards = {}, sharedUnsubs = {}; let progress = {}, personalCards = {}, personalDecks = {};
  function seq(key, fn){ const p = (chains[key] || Promise.resolve()).then(fn).catch(e => { console.error(e); toast(e && e.code === "permission-denied" ? "Sem permissão para salvar isso." : e && e.code === "resource-exhausted" ? "Limite gratuito do dia atingido. Tente amanhã." : "Falha ao salvar. Tente de novo."); }); chains[key] = p; return p; }
  const uref = (...p) => doc(db, "users", me.uid, ...p);
  const ucol = (...p) => collection(db, "users", me.uid, ...p);
  const parse = id => { const [, sid, cid] = id.split(":"); return {sid, cid}; };
  const strip = o => JSON.parse(JSON.stringify(o)); // remove undefined
  function rebuild(){
    const decks = {...personalDecks};
    Object.values(shared).forEach(d => decks["s:" + d.id] = {...d, id:"s:" + d.id, sid:d.id, shared:true});
    const cards = {...personalCards};
    Object.entries(sharedCards).forEach(([sid, cs]) => Object.values(cs).forEach(c => { const id = "s:" + sid + ":" + c.id; const pg = progress[sid + "_" + c.id] || {}; cards[id] = {reps:0, ivl:0, ease:2.5, due:0, ...c, ...pg, id, deck:"s:" + sid, shared:true}; }));
    S.decks = decks; S.cards = cards;
  }
  function watchShared(list){
    const ids = new Set(list.map(d => d.id));
    Object.keys(sharedUnsubs).forEach(sid => { if (!ids.has(sid)) { sharedUnsubs[sid](); delete sharedUnsubs[sid]; delete sharedCards[sid]; } });
    list.forEach(d => watchCards(d.id, 0));
  }
  function watchCards(sid, tries){
    if (sharedUnsubs[sid]) return;
    sharedUnsubs[sid] = onSnapshot(collection(db, "sharedDecks", sid, "cards"), q => { const o = {}; q.docs.forEach(x => o[x.id] = {...x.data(), id:x.id}); sharedCards[sid] = o; rebuild(); refresh(); }, e => {
      // logo depois de entrar com o código, a permissão pode levar um instante para valer
      delete sharedUnsubs[sid];
      if (e.code === "permission-denied" && tries < 5 && shared[sid]) setTimeout(() => watchCards(sid, tries + 1), 800 * (tries + 1)); else onErr(e);
    });
  }
  return {
    configured: () => !!(firebaseConfig && firebaseConfig.apiKey && firebaseConfig.projectId),
    boot(onUser){
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      try { db = initializeFirestore(app, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})}); }
      catch(e){ db = initializeFirestore(app, {}); }
      if (location.hostname === "localhost" && location.search.includes("emu")) { connectAuthEmulator(auth, "http://127.0.0.1:9099", {disableWarnings:true}); connectFirestoreEmulator(db, "127.0.0.1", 8080); } // só para testes locais
      onAuthStateChanged(auth, onUser);
    },
    auth: () => auth,
    async init(){
      unsubs.forEach(u => u()); unsubs = []; Object.values(sharedUnsubs).forEach(u => u());
      return new Promise(resolve => {
        let pending = 5; const done = () => { if (--pending === 0) resolve(); };
        const once = fn => { let first = true; return x => { fn(x); if (first) { first = false; done(); } else refresh(); }; };
        unsubs.push(onSnapshot(uref(), once(s => { S.profile = s.exists() ? {log:{}, newPerSession:20, ...s.data()} : {log:{}, newPerSession:20, _missing:true}; }), onErr));
        unsubs.push(onSnapshot(ucol("decks"), once(q => { const o = {}; q.docs.forEach(d => o[d.id] = {...d.data(), id:d.id}); personalDecks = o; rebuild(); }), onErr));
        unsubs.push(onSnapshot(ucol("cards"), once(q => { const o = {}; q.docs.forEach(d => o[d.id] = {...d.data(), id:d.id}); personalCards = o; rebuild(); }), onErr));
        unsubs.push(onSnapshot(ucol("progress"), once(q => { const o = {}; q.docs.forEach(d => o[d.id] = d.data()); progress = o; rebuild(); }), onErr));
        unsubs.push(onSnapshot(query(collection(db, "sharedDecks"), where("members", "array-contains", me.uid)), once(q => { Object.keys(shared).forEach(k => delete shared[k]); q.docs.forEach(d => shared[d.id] = {...d.data(), id:d.id}); watchShared(Object.values(shared)); rebuild(); }), onErr));
        setTimeout(resolve, 8000);
      });
    },
    async createShared(name, color){
      const ref = doc(collection(db, "sharedDecks"));
      await setDoc(ref, {name, color, owner:me.uid, members:[me.uid], names:{[me.uid]:me.name}, created:Date.now()});
      return "s:" + ref.id;
    },
    async joinShared(code){
      const ref = doc(db, "sharedDecks", code);
      const snap = await getDoc(ref);
      if (!snap.exists()) throw new Error("not-found");
      if ((snap.data().members || []).includes(me.uid)) return "s:" + code;
      await updateDoc(ref, {members:arrayUnion(me.uid), ["names." + me.uid]:me.name});
      return "s:" + code;
    },
    leaveShared(sid){ return seq("s"+sid, () => updateDoc(doc(db, "sharedDecks", sid), {members:arrayRemove(me.uid), ["names." + me.uid]:deleteField()})); },
    // estimativa do espaço no Firestore: tamanho do texto de cada documento + o que o Firestore soma por documento e índices
    usage(){
      let bytes = 0, docs = 0;
      const add = o => { bytes += new Blob([JSON.stringify(o)]).size; docs++; };
      [personalCards, personalDecks, progress, shared].forEach(m => Object.values(m).forEach(add));
      Object.values(sharedCards).forEach(cs => Object.values(cs).forEach(add));
      add(S.profile || {});
      return Math.round(bytes * 2 + docs * 100);
    },
    putDeck(d){
      S.decks[d.id] = d;
      if (d.shared) return seq("s"+d.sid, () => updateDoc(doc(db, "sharedDecks", d.sid), {name:d.name}));
      const {id, ...b} = d; return seq("d"+id, () => setDoc(uref("decks", id), strip(b)));
    },
    delDeck(id){
      const d = S.decks[id]; delete S.decks[id];
      if (d && d.shared) return seq("s"+d.sid, () => deleteDoc(doc(db, "sharedDecks", d.sid)));
      return seq("d"+id, () => deleteDoc(uref("decks", id)));
    },
    putCard(c, progressOnly){
      S.cards[c.id] = c;
      if (!c.id.startsWith("s:")) { const {id, ...b} = c; return seq("c"+id, () => setDoc(uref("cards", id), strip(b))); }
      const {sid, cid} = parse(c.id);
      if (progressOnly) { const pg = {}; PROG.forEach(k => { if (c[k] !== undefined) pg[k] = c[k]; }); return seq("p"+c.id, () => setDoc(uref("progress", sid + "_" + cid), pg)); }
      const b = {}; Object.keys(c).forEach(k => { if (!PROG.includes(k) && !["id","deck","shared"].includes(k)) b[k] = c[k]; });
      b.by = me.uid;
      return seq("c"+c.id, () => setDoc(doc(db, "sharedDecks", sid, "cards", cid), strip(b)));
    },
    delCard(id){
      delete S.cards[id];
      if (!id.startsWith("s:")) return seq("c"+id, () => deleteDoc(uref("cards", id)));
      const {sid, cid} = parse(id);
      return seq("c"+id, () => deleteDoc(doc(db, "sharedDecks", sid, "cards", cid)));
    },
    putProfile(){ const {_missing, ...p} = S.profile; S.profile = p; p.name = me.name; return seq("p", () => setDoc(uref(), strip(p))); },
    signOut(){ unsubs.forEach(u => u()); unsubs = []; Object.values(sharedUnsubs).forEach(u => u()); Object.keys(sharedUnsubs).forEach(k => delete sharedUnsubs[k]); return signOut(auth); },
  };
})();
function onErr(e){ console.error(e); if (e && e.code === "permission-denied") toast("Sem permissão para ler parte dos dados."); }
function refresh(){ if (["home","deck","io"].includes(view.name) || (view.name === "pdf" && !view.items && !view.busy)) render(); }

/* ---------- contagens e estatísticas ---------- */
/* árvore de baralhos: baralho pessoal guarda "parent"; compartilhado guarda no perfil de cada um (tree) */
const byCreated = (a, b) => (a.created||0) - (b.created||0);
function parentOf(d){ if (!d) return null; const p = d.shared ? (S.profile.tree || {})[d.id] : d.parent; return p && p !== d.id && S.decks[p] ? p : null; }
const childrenOf = id => Object.values(S.decks).filter(d => parentOf(d) === (id || null)).sort(byCreated);
function descendants(id){ const out = new Set([id]); const walk = x => childrenOf(x).forEach(c => { if (!out.has(c.id)) { out.add(c.id); walk(c.id); } }); walk(id); return out; }
function deckPath(id){ const parts = []; let d = S.decks[id], n = 0; while (d && n++ < 20) { parts.unshift(d.name); d = S.decks[parentOf(d)]; } return parts.join(" › "); }
// lista em ordem de árvore, para menus: [{d, depth}]
function deckTree(){ const out = []; const walk = (id, depth) => childrenOf(id).forEach(d => { out.push({d, depth}); walk(d.id, depth + 1); }); walk(null, 0); return out; }
const deckOptions = (selected, exclude) => deckTree().filter(x => !exclude || !exclude.has(x.d.id)).map(({d, depth}) => `<option value="${d.id}" ${d.id === selected ? "selected" : ""}>${"\u00a0\u00a0\u00a0".repeat(depth)}${depth ? "↳ " : ""}${esc(d.name)}</option>`).join("");
async function setParent(d, p){
  p = p || null;
  if (d.shared) { const tree = {...(S.profile.tree || {})}; if (p) tree[d.id] = p; else delete tree[d.id]; S.profile.tree = tree; return store.putProfile(); }
  return store.putDeck({...d, parent:p});
}
const ownCards = id => Object.values(S.cards).filter(c => c.deck === id);
const deckCards = id => { if (!id) return Object.values(S.cards); const ids = descendants(id); return Object.values(S.cards).filter(c => ids.has(c.deck)); };

function counts(id){ const cs = deckCards(id); return {total:cs.length, due:cs.filter(isDue).length, nw:cs.filter(isNew).length}; }
function streak(){ const log = S.profile.log || {}; let n = 0, t = Date.now(); if (!log[today(t)]) t -= DAY; while (log[today(t)] && log[today(t)][0] > 0) { n++; t -= DAY; } return n; }
function acc7(){ const log = S.profile.log || {}; let s = 0, r = 0; for (let i = 0; i < 7; i++) { const e = log[today(Date.now() - i*DAY)]; if (e) { s += e[0]; r += e[1]; } } return s ? Math.round(r/s*100) : null; }
function logReview(right){
  const log = {...(S.profile.log || {})}; const k = today(); const e = log[k] ? [...log[k]] : [0,0]; e[0]++; if (right) e[1]++; log[k] = e;
  const keys = Object.keys(log).sort(); while (keys.length > 120) delete log[keys.shift()];
  S.profile.log = log; store.putProfile();
}

// apaga o baralho, os subbaralhos e todas as cartas; baralho compartilhado de outra pessoa só é deixado
async function deleteDeckTree(did){
  const ids = [...descendants(did)].filter(id => S.decks[id]);
  const mine = ids.filter(id => !(S.decks[id].shared && S.decks[id].owner !== me.uid));
  const cards = Object.values(S.cards).filter(c => mine.includes(c.deck));
  for (const c of cards) await store.delCard(c.id);
  for (const id of ids.reverse()) { if (mine.includes(id)) await store.delDeck(id); else if (store.leaveShared) await store.leaveShared(S.decks[id].sid); }
  return {decks:ids.length, cards:cards.length};
}
function renderDeck(){

  const c = counts(d.id); const q = (view.q || "").toLowerCase();

  const crumbs = []; { let p = parentOf(d), n = 0; while (p && n++ < 20) { crumbs.unshift(S.decks[p]); p = parentOf(S.decks[p]); } }

function wireRich(){
  document.querySelectorAll(".tb button").forEach(b => {
    b.onmousedown = e => e.preventDefault();
    b.onclick = () => {
      const ed = document.getElementById(b.parentElement.dataset.for); ed.focus();
      const cmd = b.dataset.cmd;
      if (cmd === "img") return pickImage(ed);
      if (cmd === "mark") { const s = getSelection(); if (s.rangeCount && !s.isCollapsed) { const r = s.getRangeAt(0); const m = document.createElement("mark"); try { m.appendChild(r.extractContents()); r.insertNode(m); } catch(e){} } return; }
      if (cmd === "red" || cmd === "blue") { document.execCommand("styleWithCSS", false, false); document.execCommand("foreColor", false, cmd === "red" ? "#c0392b" : "#1d6fb8"); return; }
      document.execCommand(cmd, false, null);
    };
  });
  document.querySelectorAll(".ed").forEach(ed => ed.addEventListener("paste", e => {
    const html = e.clipboardData.getData("text/html"); const txt = e.clipboardData.getData("text/plain");
    const files = [...(e.clipboardData.files || [])].filter(f => f.type.startsWith("image/"));
    e.preventDefault();
    if (files.length) return resizeImage(files[0]).then(u => document.execCommand("insertImage", false, u));
    if (html) document.execCommand("insertHTML", false, clean(html)); else document.execCommand("insertText", false, txt);
  }));
}
function resizeImage(file){
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => { const max = 800, k = Math.min(1, max / Math.max(im.width, im.height)); const cv = document.createElement("canvas"); cv.width = Math.round(im.width*k); cv.height = Math.round(im.height*k); const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(im,0,0,cv.width,cv.height); res(cv.toDataURL("image/jpeg", .72)); }; im.onerror = rej; im.src = fr.result; }; fr.onerror = rej; fr.readAsDataURL(file); });
}
function pickImage(ed){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
  const sel = getSelection(); const range = sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
  inp.onchange = async () => { if (!inp.files[0]) return; try { const u = await resizeImage(inp.files[0]); ed.focus(); if (range) { sel.removeAllRanges(); sel.addRange(range); } document.execCommand("insertImage", false, u); } catch(e){ toast("Não consegui abrir essa imagem."); } };
  inp.click();
}

function readDraft(){

function saveCard(another){
  const c = readDraft(); const err = document.getElementById("e-err");

  if (c.type !== "mc") { delete out.options; delete out.correct; }

/* revisão */
function buildQueue(deckId){
  const cs = deckCards(deckId);
  const due = cs.filter(isDue).sort((a,b) => a.due - b.due);
  const nw = cs.filter(isNew).sort((a,b) => (a.created||0) - (b.created||0)).slice(0, S.profile.newPerSession || 20);
  const q = [...due, ...nw].map(c => c.id);
  for (let i = q.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i+1)); [q[i], q[j]] = [q[j], q[i]]; }
  return q;
}
function startStudy(deckId){ const q = buildQueue(deckId); if (!q.length) return toast("Nada para estudar agora."); go("study", {deck:deckId, queue:q, i:0, seen:0, right:0, firstSeen:{}, total:q.length}); }
const norm = s => plain(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/g, " ").replace(/\s+/g, " ").trim();
function matches(typed, answer){
  const a = norm(answer), t = norm(typed); if (!t) return false; if (t === a) return true;
  const da = a.replace(/\D/g, ""), dt = t.replace(/\D/g, "");  // "120" vale para "120 dias"
  return !!da && da === dt;
}
const clozeAnswers = html => [...html.matchAll(/\{\{(.+?)\}\}/g)].map(m => m[1]);
function clozeHtml(html, typed){
  let k = 0;
  return html.replace(/\{\{(.+?)\}\}/g, (_, t) => {
    const i = k++;
    if (!typed) return `<input class="cz" data-i="${i}" aria-label="Lacuna ${i+1}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" style="width:${Math.max(6, Math.min(22, plain(t).length + 3))}ch">`;
    const ty = typed[i] || "";
    return matches(ty, t) ? `<mark class="ok">${t}</mark>` : (ty.trim() ? `<s class="typed">${esc(ty)}</s> ` : "") + `<mark>${t}</mark>`;
  });
}
function renderStudy(){
  const st = view;
  if (st.i >= st.queue.length) {
    const pct = st.seen ? Math.round(st.right / st.seen * 100) : 0;
    $app.innerHTML = header() + `<div class="panel empty" style="padding:36px 20px"><h2>Sessão concluída</h2><p class="muted num">${st.seen} ${st.seen === 1 ? "carta revisada" : "cartas revisadas"} · ${pct}% de acerto na primeira tentativa</p><p class="small muted">As cartas voltam no dia certo para você revisar antes de esquecer.</p><button class="btn primary" data-act="home">Voltar aos baralhos</button></div>`;
    return;
  }
  const c = S.cards[st.queue[st.i]]; if (!c) { st.i++; return renderStudy(); }
  const d = S.decks[c.deck] || {name:""};
  const ans = st.answer; // {choice|typed, right} nas cartas corrigidas automaticamente
  const shown = st.revealed;
  let body = "", actions = "";
  if (c.type === "basic") {
    body = `<div class="content">${c.front}</div>`;
    if (!shown) body += `<textarea class="txt typed-in" id="typed" rows="2" placeholder="Digite sua resposta (opcional)"></textarea>`;
    else body += (st.typed ? `<div class="yours"><span class="label">Sua resposta</span><div>${esc(st.typed)}</div></div>` : "") + `<div class="verso content">${c.back || ""}</div>`;
  } else if (c.type === "cloze") {
    body = `<div class="content">${clozeHtml(c.front, ans ? ans.typed : null)}</div>`;
  } else if (c.type === "ce") {
    body = `<div class="content">${c.front}</div><div class="ce-row">${["C","E"].map(k => { let cls = ""; if (ans) { if (k === c.answer) cls = "right"; else if (k === ans.choice) cls = "wrong"; } return `<button class="choice ${cls}" data-act="pick" data-v="${k}" ${ans ? "disabled" : ""}>${k === "C" ? "Certo" : "Errado"}</button>`; }).join("")}</div>`;
  } else if (c.type === "mc") {
    body = `<div class="content">${c.front}</div><div class="choices">${(c.options||[]).map((o,i) => { let cls = ""; if (ans) { if (i === c.correct) cls = "right"; else if (i === ans.choice) cls = "wrong"; } return `<button class="choice ${cls}" data-act="pick" data-v="${i}" ${ans ? "disabled" : ""}><span class="l">${LETTERS[i]}</span><span>${esc(o)}</span></button>`; }).join("")}</div>`;
  }
  const auto = c.type !== "basic";
  const done = auto ? !!ans : shown;
  if (done) {
    if (auto) {
      const gab = c.type === "ce" ? (c.answer === "C" ? "Certo" : "Errado") : c.type === "mc" ? LETTERS[c.correct] : clozeAnswers(c.front).map(plain).join(" / ");
      body += `<div class="result ${ans.right ? "ok" : "no"}">${ans.right ? (c.type === "cloze" ? "Você acertou." : "Você acertou. Gabarito: " + esc(gab) + ".") : (c.type === "cloze" ? "Resposta: " : "Você errou. Gabarito: ") + esc(gab) + "."}</div>`;
    }
    if (!isBlank(c.comment)) body += `<div class="comment content"><div class="small" style="font-weight:700;margin-bottom:4px">Comentário</div>${c.comment}</div>`;
    if (auto && !ans.right) actions = `<div class="grades three" style="grid-template-columns:1fr"><button class="grade g1" data-act="grade" data-g="1">Continuar<small>volta em 10 min</small></button></div>`;
    else {
      const gs = auto ? [2,3,4] : [1,2,3,4];
      const names = {1:"Errei",2:"Difícil",3:"Bom",4:"Fácil"};
      actions = `<div class="grades ${gs.length === 3 ? "three" : ""}">${gs.map(g => `<button class="grade g${g}" data-act="grade" data-g="${g}">${names[g]}<small>${ivlText(c, g)}</small></button>`).join("")}</div>`;
    }
  } else if (c.type === "cloze") actions = `<div class="row" style="margin-top:16px"><button class="btn primary" style="flex:1;min-height:48px" data-act="checkcloze">Verificar</button><button class="btn" style="min-height:48px" data-act="giveup">Não sei</button></div>`;
  else if (!auto) actions = `<div style="margin-top:16px"><button class="btn primary" style="width:100%;min-height:48px" data-act="reveal">Mostrar resposta</button></div>`;
  const keys = done ? (auto && !ans.right ? "<kbd>Espaço</kbd> continuar" : "<kbd>1</kbd>–<kbd>4</kbd> avaliar") : c.type === "ce" ? "<kbd>C</kbd> certo · <kbd>E</kbd> errado" : c.type === "mc" ? "<kbd>A</kbd>–<kbd>E</kbd> escolher" : c.type === "cloze" ? "<kbd>Enter</kbd> verificar" : "<kbd>Enter</kbd> mostrar resposta";
  $app.innerHTML = `<div class="study-top"><button class="btn ghost" data-act="exitstudy">✕ Sair</button><div class="bar" aria-hidden="true"><i style="width:${Math.round(st.i / st.queue.length * 100)}%"></i></div><span class="small muted num">${st.i + 1}/${st.queue.length}</span></div>
    <article class="ficha"><div class="meta"><span class="deck">${esc(d.name)}</span><span class="type"><span class="tlong">${TYPES[c.type]}</span><span class="tshort">${TSHORT[c.type]}</span>${isNew(c) ? ` <span class="chip new">nova</span>` : ""}</span></div>${body}</article>
    ${actions}<p class="keys">${keys}</p>`;
  const inputs = [...$app.querySelectorAll(".cz, #typed")];
  inputs.forEach((inp, i) => inp.addEventListener("keydown", e => {
    if (e.key !== "Enter" || e.shiftKey) return;
    e.preventDefault();
    if (inp.id === "typed") return reveal();
    if (inputs[i+1]) inputs[i+1].focus(); else checkCloze(false);
  }));
  if (inputs[0] && matchMedia("(hover:hover)").matches) inputs[0].focus({preventScroll:true});
}
function reveal(){ const t = document.getElementById("typed"); view.typed = t ? t.value.trim() : ""; view.revealed = true; renderStudy(); }
function checkCloze(giveUp){
  const st = view; const c = S.cards[st.queue[st.i]]; if (st.answer) return;
  const typed = [...$app.querySelectorAll(".cz")].map(i => giveUp ? "" : i.value);

}
function pick(v){
  const st = view; const c = S.cards[st.queue[st.i]]; if (st.answer) return;
  const choice = c.type === "mc" ? +v : v;
  const right = c.type === "mc" ? choice === c.correct : choice === c.answer;
  st.answer = {choice, right}; renderStudy();
}
function grade(g){
  const st = view; const id = st.queue[st.i]; const c = S.cards[id];
  if (!st.firstSeen[id]) { st.firstSeen[id] = true; st.seen++; if (g >= 2) st.right++; logReview(g >= 2); }
  store.putCard(schedule(c, g), true);
  if (g === 1) st.queue.push(id);
  st.i++; st.answer = null; st.revealed = false; st.typed = ""; renderStudy();
}

/* importar / exportar */
function parseCSV(text){
  const first = text.split(/\r?\n/)[0] || "";
  const delim = first.includes("\t") ? "\t" : (first.split(";").length >= first.split(",").length ? ";" : ",");
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"' && f === "") q = true;
    else if (ch === delim) { row.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += ch;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
function rowsToCards(rows, defDeck){
  const out = [], errs = [], newDecks = {};
  const typeOf = s => { s = (s||"").toLowerCase().trim(); if (/^(ce|c\/e|certo)/.test(s)) return "ce"; if (/^(me|mc|m[uú]ltipla|a-e|a–e)/.test(s)) return "mc"; if (/^(lacuna|cloze|omiss)/.test(s)) return "cloze"; if (/^(b[aá]sico|basic|f\/v|frente)/.test(s) || !s) return "basic"; return null; };
  const deckFor = name => { name = (name||"").trim(); if (!name) return defDeck; const ex = Object.values(S.decks).find(d => d.name.toLowerCase() === name.toLowerCase()) || newDecks[name.toLowerCase()]; if (ex) return ex.id; const d = {id:uid(), name, color:COLORS[(Object.keys(S.decks).length + Object.keys(newDecks).length) % COLORS.length], created:Date.now()}; newDecks[name.toLowerCase()] = d; return d.id; };
  if (rows.length && /^baralho$/i.test((rows[0][0]||"").trim())) rows = rows.slice(1);
  rows.forEach((r, n) => {
    const line = n + 1; let c;
    if (r.length <= 2) c = {type:"basic", deck:defDeck, front:r[0], back:r[1] || ""};
    else {
      const [deck, tipo, frente, verso, alts, gab, com, tags] = r; const type = typeOf(tipo);
      if (!type) return errs.push(`Linha ${line}: tipo "${tipo}" desconhecido.`);
      c = {type, deck:deckFor(deck), front:frente, back:verso || "", comment:com || "", tags:(tags||"").split(/[,|]/).map(s => s.trim()).filter(Boolean)};
      if (type === "ce") { const g = (gab||"").trim().toUpperCase()[0]; if (g !== "C" && g !== "E") return errs.push(`Linha ${line}: gabarito de certo/errado deve ser C ou E.`); c.answer = g; }
      if (type === "mc") { c.options = (alts||"").split("|").map(s => s.trim()).filter(Boolean).slice(0,5); const g = LETTERS.indexOf((gab||"").trim().toUpperCase()[0]); if (c.options.length < 2) return errs.push(`Linha ${line}: separe as alternativas com | (barra vertical).`); if (g < 0 || g >= c.options.length) return errs.push(`Linha ${line}: gabarito deve ser uma letra de A a ${LETTERS[c.options.length-1]}.`); c.correct = g; }
    }
    c.front = clean(c.front); c.back = clean(c.back); c.comment = clean(c.comment || "");
    if (isBlank(c.front)) return errs.push(`Linha ${line}: frente vazia.`);
    if (!c.deck) return errs.push(`Linha ${line}: escolha um baralho de destino.`);
    out.push(c);
  });
  return {out, errs, newDecks:Object.values(newDecks)};
}
const csvField = s => { s = String(s ?? ""); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function exportCSV(deckId){
  const head = ["baralho","tipo","frente","verso","alternativas","gabarito","comentario","etiquetas"];
  const tname = {basic:"basico", ce:"ce", mc:"me", cloze:"lacuna"};
  const lines = [head.join(";")];
  deckCards(deckId || null).forEach(c => lines.push([S.decks[c.deck]?.name || "", tname[c.type], c.front, c.back || "", (c.options||[]).join(" | "), c.type === "ce" ? c.answer : c.type === "mc" ? LETTERS[c.correct] : "", c.comment || "", (c.tags||[]).join(", ")].map(csvField).join(";")));
  return "﻿" + lines.join("\r\n");
}

async function doImport(){

  else go("home");
}

/* PDF escaneado */
async function showOcr(f){
  const box = document.getElementById("ocr-box"), msg = document.getElementById("pdf-msg");
  let n = 0; try { n = await pdfPageCount(f); } catch(e){}
  msg.textContent = "";
  box.hidden = false;
  box.innerHTML = `<div class="stack" style="gap:10px;border-top:1px solid var(--line);padding-top:12px">
    <p><b>Esse PDF é escaneado</b> (as páginas são imagens), então vou ler as páginas como imagem. O gabarito pode estar em qualquer página, inclusive nas primeiras: ele é ligado sozinho a cada questão.</p>
    <div class="row small" style="gap:8px"><label for="ocr-from">Da página</label><input class="txt num" id="ocr-from" type="number" min="1" max="${n}" value="1" style="width:5.5em"><label for="ocr-to">até</label><input class="txt num" id="ocr-to" type="number" min="1" max="${n}" value="${n}" style="width:5.5em"><span class="muted">de ${n}</span></div>
    <p class="hint" id="ocr-est"></p>
    <div class="row"><button class="btn primary" id="ocr-go" type="button" style="min-height:46px">Ler páginas</button><button class="btn ghost" id="ocr-stop" type="button" hidden>Parar</button></div>
    <p class="hint">Deixe a tela ligada e o app aberto enquanto lê. Se parar no meio, o que já foi lido é aproveitado.</p>
    <div class="bar" id="ocr-bar" hidden><i style="width:0%"></i></div>
    <p id="ocr-msg" class="small muted" aria-live="polite"></p></div>`;
  const go = document.getElementById("ocr-go"), stop = document.getElementById("ocr-stop"), bar = document.getElementById("ocr-bar"), om = document.getElementById("ocr-msg");
  stop.onclick = () => { cancelOcr(); om.textContent = "Parando…"; };
  const est = () => { const a = +document.getElementById("ocr-from").value || 1, b = +document.getElementById("ocr-to").value || a; const pages = Math.max(1, b - a + 1); const min = Math.max(1, Math.round(pages * 7 / 60)); go.textContent = pages === n ? `Ler todas as ${n} páginas` : `Ler ${pages} ${pages === 1 ? "página" : "páginas"}`; document.getElementById("ocr-est").textContent = `Tempo estimado no celular: cerca de ${min} ${min === 1 ? "minuto" : "minutos"}.`; };
  ["ocr-from","ocr-to"].forEach(id => document.getElementById(id).addEventListener("input", est)); est();
  go.onclick = async () => {
    const from = Math.max(1, Math.min(n, +document.getElementById("ocr-from").value || 1));
    const to = Math.max(from, Math.min(n, +document.getElementById("ocr-to").value || from));
    go.disabled = true; stop.hidden = false; bar.hidden = false; view.busy = true;
    let lock = null; try { lock = await navigator.wakeLock?.request("screen"); } catch(e){}
    om.textContent = "Preparando o leitor (na primeira vez baixa uns 5 MB)…";
    try {
      const text = await ocrPdf(f, from, to, (cur, tot, fr) => { const pct = Math.round(((cur - 1) + fr) / tot * 100); bar.firstElementChild.style.width = pct + "%"; om.textContent = `Lendo página ${from + cur - 1} (${cur} de ${tot})… ${pct}%`; });
      view.busy = false; try { lock && lock.release(); } catch(e){}
      view.pdfSrc = f; view.pdfPages = {...lastOcr.pages}; view.badPages = [...lastOcr.empty];
      const items = parseQuestions(text);
      if (!items.length) { om.innerHTML = `<span class="err">Li as páginas, mas não reconheci questões numeradas nelas.</span> Tente outras páginas ou confira abaixo o que foi lido.`; box.insertAdjacentHTML("beforeend", `<details><summary class="small" style="cursor:pointer;font-weight:700">Ver texto lido</summary><textarea class="txt" readonly style="margin-top:8px">${esc(text)}</textarea></details>`); go.disabled = false; stop.hidden = true; return; }
      await finishPdf(items, f.name + ` (páginas ${from}–${to})`, om, text);
    } catch(err){ console.error(err); try { lock && lock.release(); } catch(e){} view.busy = false; go.disabled = false; stop.hidden = true; om.innerHTML = `<span class="err">Não consegui ler as páginas. Confira a internet e tente de novo com menos páginas.</span>`; }
  };
}

function ranges(ns){ const a = [...ns].sort((x, y) => x - y), out = []; for (let i = 0; i < a.length; i++) { let j = i; while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++; out.push(j > i ? `${a[i]}–${a[j]}` : `${a[i]}`); i = j; } return out.join(", "); }
const APP_VERSION = "21"; // acompanhar o número do cache em sw.js
// lê o PDF do gabarito (com leitura por imagem se for escaneado) e preenche as respostas pelo número da questão
async function applyKeyFile(f, items, msg){
  msg.textContent = "Lendo o gabarito…";
  let text = await extractPdfText(f, (p, n) => { msg.textContent = `Lendo o gabarito: página ${p} de ${n}…`; });
  if (text.replace(/\s/g, "").length < 20) {
    const n = Math.min(await pdfPageCount(f), 8);
    text = await ocrPdf(f, 1, n, (cur, tot, fr) => { msg.textContent = `Gabarito escaneado: lendo página ${cur} de ${tot}… ${Math.round(((cur - 1) + fr) / tot * 100)}%`; });
  }
  const key = parseAnswerKey(text); let n = 0;
  items.forEach(q => {
    const a = key[q.num]; if (!a) return;
    if (q.type === "mc") { const k = "ABCDE".indexOf(a); if (k >= 0 && k < q.options.length) { q.correct = k; n++; } }
    else if (a === "C" || a === "E") { q.answer = a; n++; }
  });
  return n;
}
async function finishPdf(items, name, msg, text){

    catch(err){ console.error(err); view.keyNote = {ok:false, text:`Não consegui ler o gabarito ${view.keyFile.name}.`}; }
  }
  view.items = items; view.file = name; renderPdf();
}

function pdfCount(){ const n = document.querySelectorAll(".pdf-inc:checked").length; const b = document.getElementById("pdf-go"); if (b) { b.textContent = n ? `Importar ${n} ${n === 1 ? "questão" : "questões"}` : "Importar"; b.disabled = !n; } }
async function pdfImport(){
  const it = view.items, deck = view.deck, err = document.getElementById("pdf-err");
  const cards = [], missing = [];
  it.forEach((q, i) => {
    if (!document.getElementById("pdf-inc" + i).checked) return;
    const g = document.getElementById("pdf-g" + i).value;
    const front = esc(document.getElementById("pdf-f" + i).value.trim()).replace(/\n/g, "<br>");
    if (g === "") { missing.push(q.num); return; }
    const cm = (document.getElementById("pdf-c" + i)?.value ?? q.comment ?? "").trim();
    const c = {deck, type:q.type, front, comment:cm ? esc(cm).replace(/\n/g, "<br>") : "", tags:[], subject:(document.getElementById("pdf-s" + i)?.value || "").trim()};
    if (q.type === "mc") { c.options = q.options.map((_, k) => document.getElementById(`pdf-o${i}-${k}`).value.trim()).filter(Boolean); c.correct = Math.min(+g, c.options.length - 1); }
    else c.answer = g;
    cards.push(c);
  });
  if (missing.length) { err.textContent = `Falta o gabarito da${missing.length > 1 ? "s questões" : " questão"} ${missing.join(", ")}. Escolha a resposta ou desmarque.`; err.hidden = false; return; }
  const btn = document.getElementById("pdf-go"); btn.disabled = true; btn.textContent = "Importando…";
  const t = Date.now();
  // sub-baralho por matéria: usa o que já existe com o mesmo nome dentro do baralho escolhido, senão cria
  const split = document.getElementById("pdf-split")?.checked && !S.decks[deck]?.shared;
  const subDecks = {}; let created = 0;
  const norm = n => n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
  if (split) {
    childrenOf(deck).forEach(d => subDecks[norm(d.name)] = d.id);
    for (const c of cards) {
      if (!c.subject) continue;
      const k = norm(c.subject);
      if (!subDecks[k]) { const d = {id:uid(), name:c.subject, color:S.decks[deck]?.color || COLORS[0], created:t + created, parent:deck}; await store.putDeck(d); subDecks[k] = d.id; created++; }
      c.deck = subDecks[k];
    }
  }
  for (let i = 0; i < cards.length; i++) { const {subject, ...c} = cards[i]; await store.putCard({id:mkId(c.deck), created:t+i, reps:0, ivl:0, ease:2.5, due:0, ...c}); }
  toast(`${cards.length} questões importadas` + (created ? `, ${created} sub-baralhos criados` : ""));
  go("deck", {id:deck});
}
async function doExport(){
  const deckId = document.getElementById("ex-deck").value; const csv = exportCSV(deckId); const out = document.getElementById("ex-out");
  const name = "fichario-" + (deckId ? (S.decks[deckId].name.toLowerCase().normalize("NFD").replace(/[^\w]+/g, "-").replace(/^-|-$/g, "")) : "todos") + "-" + today() + ".csv";
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast("Arquivo baixado"); return; } catch(e){}
  out.innerHTML = `<p class="hint">Não deu para baixar o arquivo aqui. Copie o conteúdo abaixo e cole num arquivo .csv.</p><textarea class="txt" id="ex-text" readonly></textarea><div><button class="btn" data-act="copyexp">Copiar</button></div>`;

}

    case "dseltoggle": view.dsel.has(id) ? view.dsel.delete(id) : view.dsel.add(id); renderDeck(); break;
    case "dselall": { const ids = childrenOf(view.id).map(x => x.id); const all = ids.every(x => view.dsel.has(x)); ids.forEach(x => all ? view.dsel.delete(x) : view.dsel.add(x)); renderDeck(); break; }
    case "dseldel": { const ids = [...view.dsel]; const nc = ids.reduce((n, x) => n + deckCards(x).length, 0); document.getElementById("dselconfirm").innerHTML = `<span class="confirm" style="margin-bottom:8px">Apagar ${ids.length} ${ids.length === 1 ? "subbaralho" : "subbaralhos"} e ${nc} cartas dentro? Não dá para desfazer. <button class="btn danger solid" data-act="dseldo">Apagar</button><button class="btn ghost" data-act="dselno">Não</button></span>`; break; }
    case "dselno": document.getElementById("dselconfirm").innerHTML = ""; break;
    case "dseldo": { const ids = [...view.dsel]; view.dsel = null; (async () => { let n = 0; for (const x of ids) n += (await deleteDeckTree(x)).cards; toast(`${ids.length} ${ids.length === 1 ? "subbaralho apagado" : "subbaralhos apagados"} (${n} cartas)`); renderDeck(); })(); renderDeck(); break; }
    case "selstart": view.sel = new Set(); renderDeck(); break;
    case "selcancel": view.sel = null; renderDeck(); break;
    case "selall": { const ids = [...document.querySelectorAll(".selc")].map(x => x.dataset.id); const all = ids.every(id => view.sel.has(id)); ids.forEach(id => all ? view.sel.delete(id) : view.sel.add(id)); renderDeck(); break; }
    case "seldel": document.getElementById("selconfirm").innerHTML = `<span class="confirm">Apagar ${view.sel.size} ${view.sel.size === 1 ? "carta" : "cartas"}? Não dá para desfazer. <button class="btn danger solid" data-act="seldo">Apagar</button><button class="btn ghost" data-act="selno">Não</button></span>`; break;
    case "selno": document.getElementById("selconfirm").innerHTML = ""; break;
    case "seldo": { const ids = [...view.sel]; ids.forEach(id => store.delCard(id)); view.sel = null; toast(`${ids.length} ${ids.length === 1 ? "carta apagada" : "cartas apagadas"}`); renderDeck(); break; }
    case "nodel": renderDeck(); break;
    case "deldeck": { const did = view.id; const up = parentOf(S.decks[did]); const kids = childrenOf(did); (async () => { for (const k of kids) await setParent(k, up); for (const c of ownCards(did)) await store.delCard(c.id); await store.delDeck(did); })(); toast("Baralho apagado"); go(up ? "deck" : "home", {id:up}); break; }
    case "exitstudy": go(view.deck ? "deck" : "home", {id:view.deck}); break;
    case "reveal": reveal(); break;
    case "checkcloze": checkCloze(false); break;
    case "giveup": checkCloze(true); break;
    case "pick": pick(b.dataset.v); break;
    case "grade": grade(+b.dataset.g); break;
    case "doimport": doImport(); break;
    case "doexport": doExport(); break;
    case "copyexp": { const t = document.getElementById("ex-text"); navigator.clipboard?.writeText(t.value).then(() => toast("Copiado"), () => { t.select(); toast("Selecionado. Use Ctrl+C."); }) ?? (t.select(), toast("Selecionado. Use Ctrl+C.")); break; }
  }
});
document.addEventListener("keydown", e => {
  if (view.name !== "study" || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest && e.target.closest("input,textarea,[contenteditable]")) return;
  const st = view; if (st.i >= st.queue.length) return;
  const c = S.cards[st.queue[st.i]]; if (!c) return;
  const k = e.key.toLowerCase(); const auto = c.type !== "basic";
  if (!auto && !st.revealed && (k === " " || k === "enter")) { e.preventDefault(); reveal(); return; }
  if (auto && !st.answer) {
    if (c.type === "ce" && (k === "c" || k === "e")) { pick(k.toUpperCase()); return; }
    if (c.type === "mc") { const i = LETTERS.toLowerCase().indexOf(k); if (i >= 0 && i < (c.options||[]).length) { pick(i); return; } }
    return;
  }
  if (auto && st.answer && !st.answer.right && (k === " " || k === "enter")) { e.preventDefault(); grade(1); return; }
  const done = auto ? !!st.answer : st.revealed;
  if (done && /^[1-4]$/.test(k)) { const g = +k; if (auto && g === 1) return; e.preventDefault(); grade(g); }
});

/* ---------- login ---------- */
const AUTH_ERR = {"auth/invalid-credential":"E-mail ou senha incorretos.","auth/wrong-password":"E-mail ou senha incorretos.","auth/user-not-found":"Não existe conta com esse e-mail. Toque em Criar conta.","auth/email-already-in-use":"Já existe uma conta com esse e-mail. Toque em Entrar.","auth/weak-password":"A senha precisa ter pelo menos 6 caracteres.","auth/invalid-email":"Esse e-mail não parece válido.","auth/too-many-requests":"Muitas tentativas. Espere alguns minutos.","auth/network-request-failed":"Sem internet. Confira a conexão.","auth/operation-not-allowed":"Esse tipo de login ainda não foi ativado no Firebase.","auth/configuration-not-found":"O login ainda não foi ativado no Firebase (Authentication > Método de login).","auth/unauthorized-domain":"Este endereço ainda não foi autorizado no Firebase (Authentication > Configurações > Domínios autorizados)."};
const authMsg = e => AUTH_ERR[e && e.code] || "Não deu certo (" + (e && e.code || "erro") + "). Tente de novo.";
let authMode = "login";
// WhatsApp, Instagram e Facebook abrem links num navegador interno onde o Google bloqueia o login
const inApp = /WhatsApp|Instagram|FBAN|FBAV|FB_IAB|Line\/|Snapchat|TikTok|; wv\)/i.test(navigator.userAgent);
function renderAuth(msg = ""){
  view = {name:"auth"};
  const signup = authMode === "signup";
  $app.innerHTML = `<div class="auth stack"><div class="brand">${logo}<h1>Fichário de Concurso</h1></div>
    <p class="muted">Flashcards para concurso com revisão espaçada. Entre para ver seus baralhos em qualquer celular ou computador.</p>
    <div class="panel stack" style="padding:18px">
      <div class="tabs" role="group"><button type="button" data-auth="login" aria-pressed="${!signup}">Entrar</button><button type="button" data-auth="signup" aria-pressed="${signup}">Criar conta</button></div>
      <form id="fauth">
        ${signup ? `<div class="field"><label class="label" for="a-name">Seu nome</label><input class="txt" id="a-name" autocomplete="name" required></div>` : ""}
        <div class="field"><label class="label" for="a-email">E-mail</label><input class="txt" id="a-email" type="email" autocomplete="email" required></div>
        <div class="field"><label class="label" for="a-pass">Senha</label><input class="txt" id="a-pass" type="password" autocomplete="${signup ? "new-password" : "current-password"}" minlength="6" required></div>
        <p class="err" id="a-err" ${msg ? "" : "hidden"}>${esc(msg)}</p>
        <button class="btn primary" style="min-height:46px">${signup ? "Criar conta" : "Entrar"}</button>
        ${signup ? "" : `<button type="button" class="btn ghost small" data-auth="reset">Esqueci a senha</button>`}
      </form>
      <div class="or">ou</div>
      ${inApp ? `<p class="banner" style="margin:0">Para entrar com Google, abra este link no Safari ou no Chrome: toque nos três pontinhos (ou no ícone de compartilhar) e escolha "Abrir no navegador". Por aqui, use e-mail e senha.</p>` : `<button type="button" class="btn" style="min-height:46px" data-auth="google">Entrar com Google</button>`}
    </div></div>`;
  const err = m => { const p = document.getElementById("a-err"); p.textContent = m; p.hidden = false; };
  document.getElementById("fauth").onsubmit = async e => {
    e.preventDefault();
    const email = document.getElementById("a-email").value.trim(), pass = document.getElementById("a-pass").value;
    const btn = e.target.querySelector(".btn.primary"); btn.disabled = true;
    try {
      if (signup) { const name = document.getElementById("a-name").value.trim(); pendingName = name; const cred = await createUserWithEmailAndPassword(store.auth(), email, pass); await updateProfile(cred.user, {displayName:name}); pendingName = name; }
      else await signInWithEmailAndPassword(store.auth(), email, pass);
    } catch(x){ err(authMsg(x)); btn.disabled = false; }
  };
}
let pendingName = "";
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-auth]"); if (!b) return;
  const a = b.dataset.auth;
  if (a === "login" || a === "signup") { authMode = a; renderAuth(); return; }
  if (a === "reset") {
    const email = document.getElementById("a-email").value.trim();
    if (!email) { renderAuth("Digite seu e-mail acima e toque em Esqueci a senha de novo."); return; }
    try { await sendPasswordResetEmail(store.auth(), email); toast("Enviamos um link para " + email); } catch(x){ renderAuth(authMsg(x)); }
    return;
  }
  if (a === "google") {
    const prov = new GoogleAuthProvider();
    try { await signInWithPopup(store.auth(), prov); }
    catch(x){
      if (x.code === "auth/popup-blocked") renderAuth("O navegador bloqueou a janela do Google. Permita pop-ups para este site ou use e-mail e senha.");
      else if (x.code === "auth/operation-not-supported-in-this-environment") renderAuth("Este navegador não permite entrar com Google. Abra no Safari ou no Chrome, ou use e-mail e senha.");
      else if (x.code !== "auth/popup-closed-by-user" && x.code !== "auth/cancelled-popup-request") renderAuth(authMsg(x));
    }
  }
});

/* ---------- início ---------- */
if (!store.configured()) {
  $app.innerHTML = `<div class="auth panel empty"><h2>Configuração pendente</h2><p class="muted">Falta preencher o arquivo firebase-config.js com os dados do projeto no Firebase.</p></div>`;
} else {
  store.boot(async user => {
    if (!user) { me = null; renderAuth(); return; }
    me = {uid:user.uid, email:user.email, name:user.displayName || pendingName || (user.email || "").split("@")[0]};
    $app.innerHTML = header() + `<div class="panel empty"><p class="muted">Abrindo seu fichário…</p></div>`;
    await store.init();
    if (S.profile._missing && !S.profile.seeded && !Object.keys(S.decks).length) { try { await seedExamples(); } catch(err){ console.error(err); } }
    else if (!S.profile.name && !S.profile._missing) store.putProfile();
    go("home");
  });
}
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
