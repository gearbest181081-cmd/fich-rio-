<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: uma coluna estreita de app (max 760px); a revisão vira uma ficha pautada no centro da tela */
:root{
  --bg:#eef2f1; --surface:#ffffff; --sunk:#e4eae8; --ink:#16212a; --muted:#56636d; --line:#d3dbd8;
  --accent:#1d5c88; --accent-ink:#ffffff; --accent-soft:#dbe8f2;
  --mark:#ffe36b; --mark-ink:#2a2300; --rule:#d9534f; --pauta:#e3ecf3;
  --good:#23794a; --good-soft:#dcefe3; --bad:#b8352a; --bad-soft:#f6e0dd; --warn:#9a6512; --warn-soft:#f5ead5;
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151a; --surface:#172028; --sunk:#121a20; --ink:#e4ebef; --muted:#93a2ad; --line:#2a3741;
  --accent:#6eb2e0; --accent-ink:#0b1720; --accent-soft:#1d3446;
  --mark:#e2c23a; --mark-ink:#1d1800; --rule:#e0716b; --pauta:#1e2a33;
  --good:#5cc28b; --good-soft:#18352a; --bad:#ef7466; --bad-soft:#3d1f1c; --warn:#e2aa50; --warn-soft:#3a2d17;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151a; --surface:#172028; --sunk:#121a20; --ink:#e4ebef; --muted:#93a2ad; --line:#2a3741;
  --accent:#6eb2e0; --accent-ink:#0b1720; --accent-soft:#1d3446;
  --mark:#e2c23a; --mark-ink:#1d1800; --rule:#e0716b; --pauta:#1e2a33;
  --good:#5cc28b; --good-soft:#18352a; --bad:#ef7466; --bad-soft:#3d1f1c; --warn:#e2aa50; --warn-soft:#3a2d17;
  color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.6rem;letter-spacing:-.01em}
h2{font-size:1.25rem}
h3{font-size:1.02rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:40px;font-weight:700;font-size:.95rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.88rem;margin-bottom:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
/* resumo do dia */
.today{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.today>div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.today .big{font-family:var(--display);font-size:2rem;line-height:1}
.today .first{gap:10px}
@media (max-width:560px){.today{grid-template-columns:1fr 1fr}.today .first{grid-column:1/-1}}
/* baralhos */
.decks{display:flex;flex-direction:column}
.deck{display:grid;grid-template-columns:6px 1fr auto;gap:14px;align-items:center;padding:14px 16px 14px 0;border-top:1px solid var(--line)}
.deck:first-child{border-top:0}
.deck .sw{align-self:stretch;border-radius:0 4px 4px 0}
.deck .name{font-weight:700;font-size:1.05rem;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.deck .name:hover{color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.due{background:var(--accent-soft);color:var(--accent)}
.chip.new{background:var(--good-soft);color:var(--good)}
.chip.ex{background:var(--mark);color:var(--mark-ink)}
.empty{padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px;flex-wrap:wrap}
/* lista de cartas */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.cards{display:flex;flex-direction:column}
.citem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.citem:first-child{border-top:0}
.citem:hover{background:var(--sunk)}
.citem .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tchip{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);min-width:44px;text-align:center}
/* editor */
.field{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 6px;font-weight:700;font-size:.86rem;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:520px){.seg{grid-template-columns:1fr 1fr}.seg button:nth-child(3){border-left:0}.seg button:nth-child(n+3){border-top:1px solid var(--line)}}
.rich{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.tb{display:flex;flex-wrap:wrap;gap:2px;padding:4px;border-bottom:1px solid var(--line);background:var(--sunk)}
.tb button{border:0;background:none;min-width:30px;height:32px;padding:0 3px;border-radius:6px;font-weight:700;color:var(--ink)}
@media (max-width:420px){.tb .sep{display:none}.tb{gap:1px}}
.tb button:hover{background:var(--surface)}
.tb .sep{width:1px;background:var(--line);margin:4px 3px}
.ed{min-height:84px;padding:10px 12px;outline:none;overflow-wrap:anywhere}
.ed:empty::before{content:attr(data-ph);color:var(--muted)}
.ed img,.content img{max-width:100%;height:auto;border-radius:6px;display:block;margin:6px 0}
.ed ul,.ed ol,.content ul,.content ol{padding-left:1.3em;margin:4px 0}
input.txt,select.txt,textarea.txt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;width:100%}
textarea.txt{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
.opt{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center}
.opt .letter{font-family:var(--display);font-weight:700;width:22px;text-align:center}
.ce-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radio-card{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);cursor:pointer;font-weight:700}
.radio-card:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.hint{font-size:.84rem;color:var(--muted)}
.err{color:var(--bad);font-size:.88rem;font-weight:700}
mark,.content mark{background:var(--mark);color:var(--mark-ink);padding:0 2px;border-radius:2px}
/* revisão: ficha pautada */
.study-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.actions.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){.actions.four{grid-template-columns:repeat(2,1fr)}}
.brow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.brow:first-child{border-top:0}
.brow input[type=checkbox]{width:20px;height:20px}
.brow.head{cursor:default;background:var(--sunk)}
.brow .bqty{width:72px;padding:6px 8px}
.deck[data-act]{cursor:pointer}
.deck[data-act]:hover{background:var(--sunk)}
label.deck{cursor:pointer}
.welcome{padding:18px;margin-bottom:16px;border-left:4px solid var(--accent)}
.welcome h2{margin:0 0 8px;font-size:1.2rem}
.welcome ol{margin:0 0 14px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.stats.wide{max-width:none;margin:12px 0 16px}
.stats.wide .stat{text-align:center}
.stats.n4{grid-template-columns:repeat(2,1fr)}
.stats.n5{grid-template-columns:repeat(6,1fr)}
.stats.n5 .stat:nth-child(-n+3){grid-column:span 2}
.stats.n5 .stat:nth-child(n+4){grid-column:span 3}
@media (min-width:560px){.stats.n4{grid-template-columns:repeat(4,1fr)}.stats.n5{grid-template-columns:repeat(5,1fr)}.stats.n5 .stat:nth-child(n){grid-column:auto}}
.stable{padding:4px 0;overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 64px 44px 40px 48px;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow.head{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.srow .sname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sp,.srow .sn,.srow .st{text-align:right}
.sbar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.sbar i{display:block;height:100%;background:var(--muted)}
.sbar.ok i{background:var(--good)}.sbar.mid i{background:var(--warn)}.sbar.low i{background:var(--bad)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer}
.choice.picked{border-color:var(--accent);background:var(--accent-soft)}
.choice.picked .l{color:var(--accent)}
.confirm.neutral{background:var(--accent-soft);color:var(--ink)}
#simclock.late{color:var(--bad);font-weight:700}
.simmap{margin-top:14px}
.simmap summary{cursor:pointer;font-weight:700;color:var(--muted)}
.simmap .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:8px}
.simmap .grid button{min-height:38px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:700;color:var(--muted)}
.simmap .grid button.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.simmap .grid button.cur{outline:2px solid var(--accent)}
.score{font-family:var(--display);font-size:3rem;line-height:1.1;margin:8px 0 2px}
.score.ok{color:var(--good)}.score.mid{color:var(--warn)}.score.low{color:var(--bad)}
.alts{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.alts li{padding:5px 8px;border-radius:6px}
.alts li.right{background:var(--good-soft);color:var(--good)}
.alts li.wrong{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
@media (max-width:420px){.srow{grid-template-columns:minmax(0,1fr) 54px 30px 44px}.srow .sbar,.srow.head>span:nth-child(2){display:none}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:360px;margin:18px auto}
.stats .stat{background:var(--sunk);border-radius:var(--r);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.stats b{font-size:1.35rem}
.stats span{font-size:.82rem;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.ficha{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(10,30,50,.35);padding:66px 22px 22px;
  background-image:linear-gradient(var(--rule),var(--rule)),repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--pauta) 31px,var(--pauta) 32px);
  background-size:100% 2px,100% 100%;background-position:0 52px,0 60px;background-repeat:no-repeat,repeat;line-height:32px;font-size:1.1rem;min-height:220px}
.ficha .meta{position:absolute;top:0;left:22px;right:22px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;line-height:1.25}
.ficha .meta .deck{flex:1 1 auto;font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ficha .meta .type{display:flex;gap:6px;align-items:center;font-size:.82rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.cz{font:inherit;color:var(--ink);border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:4px 4px 0 0;padding:0 6px;line-height:1.4;max-width:100%}
mark.ok{background:var(--good-soft);color:var(--good)}
s.typed{color:var(--bad)}
.ficha .tshort{display:none}
@media (max-width:520px){.ficha .tlong{display:none}.ficha .tshort{display:inline}}
.yours{margin-top:14px;padding:6px 12px;border-left:3px solid var(--line);line-height:1.5}
.typed-in{margin-top:14px;font-family:var(--body)!important;font-size:1rem!important;min-height:0!important;line-height:1.5}
.ficha .content p{margin:0}
.verso{margin-top:16px;padding-top:14px;border-top:2px dashed var(--line)}
.blank{display:inline-block;min-width:4em;border-bottom:2px solid var(--accent);color:transparent;line-height:1.2}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.choice{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;line-height:1.45;font-size:1rem}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .l{font-family:var(--display);font-weight:700;color:var(--muted)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.ce-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.ce-row .choice{grid-template-columns:1fr;text-align:center;font-weight:700;font-size:1.05rem}
.result{margin-top:14px;padding:10px 14px;border-radius:8px;font-weight:700;line-height:1.45}
.result.ok{background:var(--good-soft);color:var(--good)}
.result.no{background:var(--bad-soft);color:var(--bad)}
.comment{margin-top:12px;line-height:1.5;font-size:1rem}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.grades.three{grid-template-columns:repeat(3,1fr)}
.grade{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 4px;font-weight:700}
.grade small{font-weight:400;color:var(--muted);font-size:.78rem}
.grade.g1{border-color:var(--bad);color:var(--bad)}
.grade.g2{border-color:var(--warn);color:var(--warn)}
.grade.g3{border-color:var(--good);color:var(--good)}
.grade.g4{border-color:var(--accent);color:var(--accent)}
.grade:hover{background:var(--sunk)}
.keys{margin-top:14px;font-size:.78rem;color:var(--muted);text-align:center}
@media (hover:none){.keys{display:none}}
kbd{font:inherit;font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:700;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
pre.fmt{background:var(--sunk);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:.8rem;margin:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px;font-weight:700;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.auth{max-width:420px;margin:6vh auto 0}
.auth form{display:flex;flex-direction:column;gap:12px}
.auth .tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.auth .tabs button{border:0;background:var(--surface);padding:9px;font-weight:700;color:var(--muted)}
.auth .tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.who{font-size:.88rem;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;background:var(--sunk);padding:4px 8px;border-radius:6px;user-select:all;overflow-wrap:anywhere}
.chip.shared{background:var(--warn-soft);color:var(--warn)}
.deck .tw{display:flex;align-items:center;gap:6px;min-width:0}
.fold{border:0;background:none;width:28px;height:28px;border-radius:6px;color:var(--muted);font-size:.8rem;flex:none}
.fold:hover{background:var(--sunk);color:var(--ink)}
.fold.none{visibility:hidden}
.subs{display:flex;flex-direction:column}
.crumbs{font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:inherit}
/* cabeçalho compacto: marca à esquerda, menu da conta à direita */
.top{margin-bottom:16px;flex-wrap:nowrap}
.top h1{font-size:1.2rem}
.brand{border:0;background:none;padding:0;cursor:pointer;color:inherit;text-align:left}
.menu{position:relative}
.menu>summary{list-style:none;cursor:pointer;width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.9rem;user-select:none}
.menu>summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:46px;z-index:15;min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 30px -12px rgba(0,0,0,.35);padding:6px;display:flex;flex-direction:column}
.menu-pop .who-full{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:.88rem;line-height:1.35;overflow-wrap:anywhere}
.menu-pop button{border:0;background:none;text-align:left;padding:10px;border-radius:6px;font-weight:700}
.menu-pop button:hover{background:var(--sunk)}
.back{margin:-4px 0 8px -10px}
/* barra de ações: botões do mesmo tamanho lado a lado */
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.actions .btn{padding:8px 10px;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 8px;min-height:32px}
.btn.small{min-height:32px;padding:4px 10px;font-size:.85rem}
.selbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--sunk);border-radius:8px;padding:6px 8px 6px 12px;margin-bottom:8px}
.deck input[type=checkbox]{width:20px;height:20px;margin:0 0 0 14px}
.deck.sel{grid-template-columns:auto 1fr auto}
.foot{margin-top:22px;display:flex;flex-direction:column;gap:2px}
.check{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.check input{width:20px;height:20px;margin:2px 0 0}
.sticky-bar{flex-wrap:nowrap;position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:16px;z-index:5}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="top"><div class="brand"><h1>Fichário de Concurso</h1></div></div>
  <div class="panel empty"><p class="muted">Abrindo seu fichário…</p></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
